[project]
name = "depth-based-volumetry"
version = "0.1.0"
description = "Box volumetry and home perception experiments from aligned colour + depth images."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
realsense = [
    "pyrealsense2>=2.50",
]

[project.scripts]
depth-volumetry = "depth_volumetry.cli:main"
lab = "perception_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["depth_volumetry", "perception_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
